<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>

    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="quiz-container">

        <div class="quiz-header">
            <h1>Quiz App</h1>
            <p>Test your knowledge</p>
        </div>

        <div class="quiz-box">

            <div class="question-info">
                <span id="question-count"></span>

            </div>

            <h2 class="question" id="question">
            </h2>

            <div class="options">

                <button class="option" id="option1">

                </button>

                <button class="option" id="option2">

                </button>

                <button class="option" id="option3">

                </button>

                <button class="option" id="option4">

                </button>

            </div>

            <button class="next-btn" id="nextBtn">Next Question</button>

        </div>

    </div>
    <script src="quiz.js"></script>
</body>

</html>
